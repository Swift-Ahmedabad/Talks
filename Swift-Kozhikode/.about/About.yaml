name: "Swift Kozhikode"
description: "Welcome to Swift Kozhikode, a community for iOS and macOS developers, designers, and enthusiasts in Kozhikode! Whether you're a seasoned professional, a budding developer, or simply passionate about Apple's Swift programming language, this is your space to connect, learn, and grow.\nOur mission is to:\nFoster collaboration and knowledge sharing around Swift, SwiftUI, Xcode, and iOS/macOS app development\nHost engaging sessions including hands-on workshops, tech talks, and discussions with industry experts.\nBuild a vibrant network of developers and innovators contributing to the Apple developer ecosystem from Kerala.\nJoin us to stay updated on our events, hackathons, coding challenges, and much more. Let’s build the future of Swift development together—right here in Kozhikode!\nLet’s code. Let’s connect. Let’s create."
